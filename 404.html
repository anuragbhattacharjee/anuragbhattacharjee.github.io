<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening Anurag Bhattacharjee's portfolio</title>
    <script>
      (function (location) {
        const path = location.pathname
          .slice(1)
          .split("/")
          .map(encodeURIComponent)
          .join("/");
        const query = location.search
          ? "&" + location.search.slice(1).replace(/&/g, "~and~")
          : "";

        location.replace(
          location.origin + "/?/" + path + query + location.hash,
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
